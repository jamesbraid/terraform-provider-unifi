---
services:
  unifi:
    # A controller that seeds its own admin account; unifi-emu-herder starts
    # every device the tests see, so nothing here needs simulation mode. The
    # image declares its own healthcheck; the harness polls it before the
    # first login (internal/controllertest.waitForHealthy).
    image: ${UNIFI_TEST_CONTROLLER_IMAGE:?internal/controllertest sets this from unifi.UnifiVersion}
    # Promotion jobs set this to "never" after inspecting the expected local
    # manifest. Developer runs retain Compose's ordinary pull-if-missing
    # behaviour.
    pull_policy: ${UNIFI_TEST_CONTROLLER_PULL_POLICY:-missing}
    init: true
    environment:
      TZ: Etc/UTC
    # Only the API port is published, on an ephemeral host port so concurrent
    # or abruptly cancelled acceptance runs cannot reserve 8443 globally.
    # Devices reach the inform port over the Compose network, by the
    # controller's address on it, never through the host.
    ports:
      - "0:8443"
    # No container_name and no restart policy on purpose. A fixed name lets one
    # leftover container block every later run, and an ephemeral test
    # controller that restarts itself turns that leftover into a permanent one.
    # The harness looks the container up by service name.
