when:
  - event: manual

labels:
  pool: skunkworks

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  - name: exact-released-candidate-schema
    image: golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    commands:
      # First command in the first step, so a run that read the wrong workspace
      # says so before any verdict it produces. See cmd/workspace-provenance.
      - go run ./cmd/workspace-provenance
      - apt-get update
      - apt-get install --yes --no-install-recommends ca-certificates curl jq unzip
      - curl --fail --location --silent --show-error --output /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
      - echo 'd25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d  /tmp/terraform.zip' | sha256sum --check -
      - curl --fail --location --silent --show-error --output /tmp/tofu.zip https://github.com/opentofu/opentofu/releases/download/v1.12.1/tofu_1.12.1_linux_amd64.zip
      - echo '1fc9af962e3632b7cd0ba27076cd9f1ced177567defe9e331ac37f5a40468575  /tmp/tofu.zip' | sha256sum --check -
      - curl --fail --location --silent --show-error --output /tmp/provider.zip https://github.com/jamesbraid/terraform-provider-unifi/releases/download/v0.101.2/terraform-provider-unifi_0.101.2_linux_amd64.zip
      - echo '9954f29512f0049f0e86908e2fc11a8a0e3cb11f980f3468d5e3da4005fab4b8  /tmp/provider.zip' | sha256sum --check -
      - unzip -q /tmp/terraform.zip -d /tmp
      - unzip -q /tmp/tofu.zip -d /tmp
      - mkdir -p /tmp/released-provider
      - unzip -q /tmp/provider.zip -d /tmp/released-provider
      - chmod +x /tmp/terraform /tmp/tofu /tmp/released-provider/terraform-provider-unifi_v0.101.2
      - env GIT_TERMINAL_PROMPT=0 git fetch --force --no-tags https://github.com/jamesbraid/terraform-provider-unifi.git refs/tags/v0.101.2:refs/tags/v0.101.2
      - go run ./cmd/go-unifi-proxy
      # Deliberately not "all" -- see catalog-controller-differential.yml. It
      # writes graph-wide sums into go.sum and the schema baseline generator
      # then refuses the dirty tree.
      - env GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.101.0
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.102.0
      - CATALOG_DEPENDENCY_OUTPUT=/tmp/catalog-dependency-publishability.json bash .woodpecker/scripts/catalog-dependency-publishability.sh
      # BACKSTOP, NOT THE CHECK. Every field below is a constant the script
      # writes only after its own expect() calls have passed -- fail() exits 1
      # and runs under set -e, so a real disagreement aborts before this line is
      # reached. Redundant is not vacuous: this catches the script's abort
      # regressing, which is why it stays. It is not evidence that the
      # dependency was verified here, and it should not be counted as a check
      # when someone next tallies what this pipeline verifies.
      - jq -e '.result == "pass" and .module_path == "github.com/ubiquiti-community/go-unifi" and .replace_present == false and .resolution_runner == "remote_ci" and .network_boundary == "remote_ci_only"' /tmp/catalog-dependency-publishability.json
      # The self-test existed and nothing invoked it, so a break in the script
      # it covers and no break at all looked identical. It goes immediately
      # before the producer, and after the CLI downloads, because it needs the
      # same two binaries the producer does.
      - TERRAFORM_BIN=/tmp/terraform TOFU_BIN=/tmp/tofu bash .woodpecker/scripts/catalog-build-schema_test.sh
      - CATALOG_RELEASED_PROVIDER_BINARY=/tmp/released-provider/terraform-provider-unifi_v0.101.2 CATALOG_BUILD_SCHEMA_OUTPUT=/tmp/catalog-build-schema.json TERRAFORM_BIN=/tmp/terraform TOFU_BIN=/tmp/tofu bash -x .woodpecker/scripts/catalog-build-schema.sh
      # BACKSTOP, NOT THE CHECK. The schema comparison happens in the script:
      # five cmp calls under set -e against the released canonical projections
      # and the committed contracts, any of which aborts before result is
      # written. promotion_blockers covers toolchain pins only, and the script
      # exits 1 on them unless CATALOG_ALLOW_DIAGNOSTIC_TOOLCHAIN is set.
      - jq -e '.result == "pass" and (.promotion_blockers | length) == 0 and .build_network == "none"' /tmp/catalog-build-schema.json
      - jq '.' /tmp/catalog-build-schema.json
