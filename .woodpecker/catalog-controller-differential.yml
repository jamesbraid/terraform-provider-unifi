when:
  - event: manual
  - event: push
    branch: emdash/control-plane-completion

labels:
  pool: skunkworks

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  - name: waves-1-through-5-controller-differential
    image: golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apt-get update
      - apt-get install --yes --no-install-recommends ca-certificates curl docker.io git jq unzip
      - bash .woodpecker/scripts/catalog-controller-differential_test.sh
      - curl --fail --location --silent --show-error --output /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
      - echo 'd25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d  /tmp/terraform.zip' | sha256sum --check -
      - unzip -q /tmp/terraform.zip -d /tmp
      - curl --fail --location --silent --show-error --output /tmp/tofu.zip https://github.com/opentofu/opentofu/releases/download/v1.12.1/tofu_1.12.1_linux_amd64.zip
      - echo '1fc9af962e3632b7cd0ba27076cd9f1ced177567defe9e331ac37f5a40468575  /tmp/tofu.zip' | sha256sum --check -
      - unzip -q /tmp/tofu.zip -d /tmp
      - curl --fail --location --silent --show-error --output /tmp/provider.zip https://github.com/jamesbraid/terraform-provider-unifi/releases/download/v0.101.2/terraform-provider-unifi_0.101.2_linux_amd64.zip
      - echo '9954f29512f0049f0e86908e2fc11a8a0e3cb11f980f3468d5e3da4005fab4b8  /tmp/provider.zip' | sha256sum --check -
      - mkdir -p /tmp/released-provider
      - unzip -q /tmp/provider.zip -d /tmp/released-provider
      - chmod +x /tmp/terraform /tmp/tofu /tmp/released-provider/terraform-provider-unifi_v0.101.2
      - env GIT_TERMINAL_PROMPT=0 git clone --depth 1 https://github.com/jamesbraid/unifi-emu.git /tmp/unifi-emu
      - test "$(git -C /tmp/unifi-emu rev-parse HEAD)" = 3df84e841e9dad8e32ad94d341bf8cf64fcf4d55
      - env GIT_TERMINAL_PROMPT=0 git fetch --force --no-tags https://github.com/jamesbraid/terraform-provider-unifi.git refs/tags/v0.101.2:refs/tags/v0.101.2
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy_test.sh
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy.sh
      - env GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download all
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.101.0
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.102.0
      - CATALOG_DEPENDENCY_OUTPUT=/tmp/catalog-dependency-publishability.json bash .woodpecker/scripts/catalog-dependency-publishability.sh
      - jq -e '.result == "pass" and .module_path == "github.com/ubiquiti-community/go-unifi" and .module_version == "v1.102.0" and .replace_present == false and .resolution_runner == "remote_ci" and .network_boundary == "remote_ci_only"' /tmp/catalog-dependency-publishability.json
      - CATALOG_RELEASED_PROVIDER_BINARY=/tmp/released-provider/terraform-provider-unifi_v0.101.2 CATALOG_BUILD_SCHEMA_OUTPUT=/tmp/catalog-build-schema.json CATALOG_BUILD_SCHEMA_EVIDENCE_DIRECTORY=/tmp/catalog-build-evidence TERRAFORM_BIN=/tmp/terraform TOFU_BIN=/tmp/tofu bash .woodpecker/scripts/catalog-build-schema.sh
      - jq -e '.result == "pass" and .promotion_blockers == [] and .build_network == "none"' /tmp/catalog-build-schema.json
      - CATALOG_UNIT_OUTPUT=/tmp/catalog-unit-differential.json bash .woodpecker/scripts/catalog-unit-differential.sh
      - jq -e '.result == "pass" and .network == "none" and .promotion_blockers == [] and .released.result == "pass" and .candidate.result == "pass"' /tmp/catalog-unit-differential.json
      - jq '.' /tmp/catalog-unit-differential.json
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go -C /tmp/unifi-emu mod download all
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local CGO_ENABLED=0 go -C /tmp/unifi-emu build -trimpath -buildvcs=false -o /tmp/unifi-emu-herder ./cmd/unifi-emu-herder
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local CGO_ENABLED=0 go -C /tmp/unifi-emu build -trimpath -buildvcs=false -o /tmp/unifi-emu-bin ./cmd/unifi-emu
      - cp /tmp/unifi-emu-bin .woodpecker/fixtures/catalog-acceptance/unifi-emu
      - cp /tmp/unifi-emu/scripts/devices.fleet.json .woodpecker/fixtures/catalog-acceptance/devices.fleet.json
      - docker build --network=none --tag local/unifi-emu:3df84e841e9dad8e32ad94d341bf8cf64fcf4d55 .woodpecker/fixtures/catalog-acceptance
      - docker pull docker.io/testcontainers/ryuk@sha256:31b31269d06603366cbfd0284708dcd2e281e8a4188e53fce3d3304439d0df3d
      - CATALOG_CONTROLLER_IMAGE=ghcr.io/jamesbraid/unifi-network@sha256:9d19c8d03948a77d28181743fb81a515aa51a5cea0856bc0491b34d92a01bcf4 CATALOG_SYNTHETIC_IMAGE=local/unifi-emu:3df84e841e9dad8e32ad94d341bf8cf64fcf4d55 CATALOG_RYUK_IMAGE=docker.io/testcontainers/ryuk@sha256:31b31269d06603366cbfd0284708dcd2e281e8a4188e53fce3d3304439d0df3d CATALOG_HERDER_BIN=/tmp/unifi-emu-herder TERRAFORM_BIN=/tmp/terraform CATALOG_ACCEPTANCE_WAVES=1,2,3,4,5 CATALOG_ACCEPTANCE_OUTPUT=/tmp/catalog-controller-differential.json CATALOG_REQUIRE_COMPLETE=false bash .woodpecker/scripts/catalog-controller-differential.sh
      - jq -e '.result == "blocked_evidence" and (.released.result == "pass" or .released.result == "accepted_limitation") and .candidate.result == "pass" and .plan.evidence_gap_count == 10' /tmp/catalog-controller-differential.json
      - jq '.' /tmp/catalog-controller-differential.json
      - if bash .woodpecker/scripts/catalog-controller-followup.sh /tmp/catalog-controller-differential.json | grep -Fxq diagnostic_complete; then exit 0; fi; bash .woodpecker/scripts/catalog-controller-followup.sh /tmp/catalog-controller-differential.json | grep -Fxq full
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-hardware-disposition -controller /tmp/catalog-controller-differential.json -output /tmp/catalog-hardware-disposition.json
      - jq -e '.result == "pass" and .kind == "action" and .name == "unifi_port" and .mode == "protocol_sufficient" and .claim_scope == "controller_poe_configuration_persistence" and .physical_electrical_claim == false and .resolved_signal == "hardware_claim"' /tmp/catalog-hardware-disposition.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-pragmatic-evidence -inventory build/release-ready/catalog-evidence-inventory.json -fleet-summary build/restricted/catalog-fleet-gap-summary.json -references provider-codegen/policy/catalog-pragmatic-references.json -controller-receipt /tmp/catalog-controller-differential.json -output /tmp/catalog-pragmatic-resolution.json
      - jq -e '.result == "blocked_evidence" and .resolved_signal_count == 9 and .remaining_signal_count == 1 and (.controller_receipt_sha256 | length) == 64' /tmp/catalog-pragmatic-resolution.json
      - jq '.' /tmp/catalog-pragmatic-resolution.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-admission -inventory build/release-ready/catalog-evidence-inventory.json -build-schema /tmp/catalog-build-schema.json -unit /tmp/catalog-unit-differential.json -controller /tmp/catalog-controller-differential.json -pragmatic /tmp/catalog-pragmatic-resolution.json -output /tmp/catalog-admission.json
      - jq -e '.result == "pass" and .admitted_surface_count == 67 and .release_blocker_count == 1 and .release_blockers == [{"kind":"action","name":"unifi_port","signal":"hardware_claim"}] and ([.surfaces[] | select(.state != "admitted" or .adapter_state != "adapter_parity")] | length) == 0' /tmp/catalog-admission.json
      - jq '.' /tmp/catalog-admission.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-management-contract -admission /tmp/catalog-admission.json -build-schema /tmp/catalog-build-schema.json -policy provider-codegen/policy/catalog-management-contract.json -output /tmp/catalog-management-contract.json
      - jq -e '.result == "ready_for_downstream_verification" and (.surfaces | length) == 67 and ([.surfaces[] | select(.capture_mode == "managed")] | length) == 28 and ([.surfaces[] | select(.capture_mode == "not_applicable")] | length) == 39' /tmp/catalog-management-contract.json
      - jq '.' /tmp/catalog-management-contract.json
      - bash .woodpecker/scripts/m3-evidence-lib_test.sh
      - M3_CANDIDATE_PROVIDER_BINARY=/tmp/catalog-build-evidence/terraform-provider-unifi M3_LIFECYCLE_RECEIPT_OUTPUT=/tmp/catalog-dns-lifecycle.json bash .woodpecker/scripts/m3-dns-qualification.sh
      - jq -e '.result == "pass" and .lifecycle.bidirectional_adapter_state_round_trip == true and .lifecycle.v0_integer_ttl_state_upgrade == true and .cli_outcomes_equivalent == true and .adapter_outcomes_equivalent == true' /tmp/catalog-dns-lifecycle.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-migration-recovery -admission /tmp/catalog-admission.json -build-schema /tmp/catalog-build-schema.json -controller /tmp/catalog-controller-differential.json -inventory build/release-ready/catalog-evidence-inventory.json -migration-manifest provider-codegen/generated/catalog-migration-manifest.json -dns-lifecycle /tmp/catalog-dns-lifecycle.json -output /tmp/catalog-migration-recovery.json
      - jq -e '.result == "pass" and .surface_count == 67 and .recovery_count == 67 and .strategy_counts == {"identity":67} and .evidence_modes == {"dns_bidirectional_state":1,"dns_list_controller":1,"source_identity":65} and ([.surfaces[] | select(.state != "migration_recovery_pass" or (.receipt_sha256 | length) != 64)] | length) == 0' /tmp/catalog-migration-recovery.json
      - jq '.' /tmp/catalog-migration-recovery.json
