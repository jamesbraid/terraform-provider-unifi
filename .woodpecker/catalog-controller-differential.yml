when:
  - event: manual

labels:
  pool: skunkworks

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  - name: waves-1-through-5-controller-differential
    # The campaign itself, and the step with most to lose to a hang: it starts
    # controllers for both providers and runs 152 acceptance tests twice. The
    # go test invocations inside carry -timeout 90m, but nothing bounds the
    # docker work around them, so a wedged container can hold the runner until
    # someone notices.
    #
    # WANTED: 120m, above the inner 90m so a test-level timeout still reports as
    # a test failure rather than as this. NOT SET, AND NOT SETTABLE HERE -- a
    # step `timeout:` is parsed and discarded, which is why this is prose. The
    # enforcing limit is per-repository server state; see check_inert_workflow_keys_test.go.
    # It is also the wrong shape for this step: the observed server ceiling is
    # about an hour, so 120m could not be honoured even if the key worked.
    image: golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # First command in the first step, so a run that read the wrong workspace
      # says so before any verdict it produces. See cmd/workspace-provenance.
      - go run ./cmd/workspace-provenance
      - apt-get update
      - apt-get install --yes --no-install-recommends ca-certificates curl docker.io git jq unzip
      # The released tag must exist BEFORE the self-test, not fourteen lines
      # after it. The self-test asks git whether each planned test is defined at
      # v0.101.2, and with the tag absent every ask failed, every test looked
      # missing from the released tree, and pipeline 186 reported a stale
      # inventory that was not stale. Fetching here costs nothing and is the
      # difference between that check working and that check lying.
      - env GIT_TERMINAL_PROMPT=0 git fetch --force --no-tags https://github.com/jamesbraid/terraform-provider-unifi.git refs/tags/v0.101.2:refs/tags/v0.101.2
      # The module cache must exist BEFORE the self-test, because the self-test
      # now builds the released tree and vets it under GOPROXY=off. Pipeline 190
      # died here: every import reported "module lookup disabled by GOPROXY=off"
      # from a vet that was correct and a cache that was empty. The tag fix moved
      # one producer above its consumer and then I gave the same consumer a new
      # dependency without re-running the audit.
      - go run ./cmd/go-unifi-proxy
      # Deliberately not "all". That resolves the entire module graph and
      # writes sums for test dependencies OF dependencies into go.sum, leaving
      # ` M go.sum` behind -- which every evidence generator below then refuses
      # to run against, correctly. The no-argument form fetches exactly what
      # builds and tests this module, and leaves the tree clean.
      - env GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.101.0
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.102.0
      - curl --fail --location --silent --show-error --output /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
      - echo 'd25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d  /tmp/terraform.zip' | sha256sum --check -
      - unzip -q /tmp/terraform.zip -d /tmp
      - curl --fail --location --silent --show-error --output /tmp/tofu.zip https://github.com/opentofu/opentofu/releases/download/v1.12.1/tofu_1.12.1_linux_amd64.zip
      - echo '1fc9af962e3632b7cd0ba27076cd9f1ced177567defe9e331ac37f5a40468575  /tmp/tofu.zip' | sha256sum --check -
      - unzip -q /tmp/tofu.zip -d /tmp
      - curl --fail --location --silent --show-error --output /tmp/provider.zip https://github.com/jamesbraid/terraform-provider-unifi/releases/download/v0.101.2/terraform-provider-unifi_0.101.2_linux_amd64.zip
      - echo '9954f29512f0049f0e86908e2fc11a8a0e3cb11f980f3468d5e3da4005fab4b8  /tmp/provider.zip' | sha256sum --check -
      - mkdir -p /tmp/released-provider
      - unzip -q /tmp/provider.zip -d /tmp/released-provider
      - chmod +x /tmp/terraform /tmp/tofu /tmp/released-provider/terraform-provider-unifi_v0.101.2
      - env GIT_TERMINAL_PROMPT=0 git clone --depth 1 https://github.com/jamesbraid/unifi-emu.git /tmp/unifi-emu
      - test "$(git -C /tmp/unifi-emu rev-parse HEAD)" = 3df84e841e9dad8e32ad94d341bf8cf64fcf4d55
      # The inventory is committed evidence describing the tree it was
      # generated from. Regenerate it here so a test or runtime edit can never
      # leave it asserting a digest that no longer exists.
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOFLAGS=-mod=readonly GOTOOLCHAIN=local go run ./cmd/catalog-evidence -baseline build/m0/provider-schema-digests.json -contracts provider-codegen/generated/catalog-surface-contracts.json -policy provider-codegen/policy/catalog-evidence.json -candidate-root . -output build/release-ready/catalog-evidence-inventory.json
      # NO -tree-state HERE, DELIBERATELY. This artifact is committed and then
      # byte-compared on the next line, which is a stronger statement than a
      # tree-state field: a dirty tree that changes the inventory fails the
      # comparison, and one that does not change it cannot have described this
      # artifact wrongly. Recording tree state as well would put a second,
      # weaker claim beside the one that already holds.
      - git diff --exit-code -- build/release-ready/catalog-evidence-inventory.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-dependency-publishability -output /tmp/catalog-dependency-publishability.json -resolution-runner remote_ci -tree-state "$(go run ./cmd/tree-state -what 'the dependency publishability receipt')"
      # BACKSTOP, AND ONLY replace_present IS MEASURED. See
      # catalog-build-schema.yml for the full reasoning; the other four
      # conjuncts compare a constant, or this line's own argument, to itself.
      # MOVED INTO Go, and the analysis above is why it was worth doing rather
      # than deleting. Four of the five conjuncts compare a constant to itself;
      # replace_present is the one with a measurement behind it. The Go gate
      # keeps all five, marked as the backstop they are, and adds the facts the
      # receipt already carries that nothing read: both digests checked for
      # alphabet as well as length, refused if identical because the archive and
      # the extracted tree cannot hash alike unless one was copied, the provider
      # commit, the module version, and the tree state. Fourteen mutations cover
      # them one clause at a time -- see CheckDependencyPublishabilityReceipt.
      - go run ./cmd/receipt-gate -gate catalog-dependency-publishability -receipt /tmp/catalog-dependency-publishability.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-build-schema -released-provider-binary /tmp/released-provider/terraform-provider-unifi_v0.101.2 -inventory build/release-ready/catalog-evidence-inventory.json -evidence-directory /tmp/catalog-build-evidence -terraform /tmp/terraform -tofu /tmp/tofu -output /tmp/catalog-build-schema.json -tree-state "$(go run ./cmd/tree-state -what 'the released schema baseline and digests')"
      # BACKSTOP -- the schema comparison is in the binary, which writes the
      # receipt before returning non-zero. This decodes it strictly from outside
      # the process that wrote it.
      - go run ./cmd/receipt-gate -gate catalog-build-schema -receipt /tmp/catalog-build-schema.json
      # Needs no binaries and no controller, so it goes straight before the
      # producer it covers.
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-unit-differential -output /tmp/catalog-unit-differential.json -tree-state "$(go run ./cmd/tree-state -what 'the unit differential receipt')"
      # BACKSTOP for result and network; the per-suite results are derived from
      # the go test event stream and DO carry information, including the floor
      # that an empty run is not a pass.
      - go run ./cmd/receipt-gate -gate catalog-unit-differential -receipt /tmp/catalog-unit-differential.json
      - jq '.' /tmp/catalog-unit-differential.json
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go -C /tmp/unifi-emu mod download all
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local CGO_ENABLED=0 go -C /tmp/unifi-emu build -trimpath -buildvcs=false -o /tmp/unifi-emu-herder ./cmd/unifi-emu-herder
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local CGO_ENABLED=0 go -C /tmp/unifi-emu build -trimpath -buildvcs=false -o /tmp/unifi-emu-bin ./cmd/unifi-emu
      - cp /tmp/unifi-emu-bin .woodpecker/fixtures/catalog-acceptance/unifi-emu
      - cp /tmp/unifi-emu/scripts/devices.fleet.json .woodpecker/fixtures/catalog-acceptance/devices.fleet.json
      - docker build --network=none --tag local/unifi-emu:3df84e841e9dad8e32ad94d341bf8cf64fcf4d55 .woodpecker/fixtures/catalog-acceptance
      - docker pull docker.io/testcontainers/ryuk@sha256:31b31269d06603366cbfd0284708dcd2e281e8a4188e53fce3d3304439d0df3d
      # -waves IS PASSED EXPLICITLY. The binary's default is 1,2,3,4 and this
      # campaign runs five, so relying on the default would silently drop a wave
      # -- the shell had the same split and the workflow set it there too.
      # CATALOG_REQUIRE_COMPLETE has no flag: it was false here, which selected
      # the shell's default of not additionally requiring result == "pass", and
      # that is what this binary does without being asked.
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-controller-differential -controller-image ghcr.io/jamesbraid/unifi-network@sha256:9d19c8d03948a77d28181743fb81a515aa51a5cea0856bc0491b34d92a01bcf4 -synthetic-image local/unifi-emu:3df84e841e9dad8e32ad94d341bf8cf64fcf4d55 -ryuk-image docker.io/testcontainers/ryuk@sha256:31b31269d06603366cbfd0284708dcd2e281e8a4188e53fce3d3304439d0df3d -herder /tmp/unifi-emu-herder -terraform /tmp/terraform -waves 1,2,3,4,5 -print-failure-diagnostics -output /tmp/catalog-controller-differential.json -tree-state "$(go run ./cmd/tree-state -what 'the controller differential receipt')"
      # THE .result CONJUNCT IS GONE FROM THIS LINE, and its removal is the last
      # of task 160's doors. It read `.result == "blocked_evidence"`, which is
      # the campaign's state today and not a property of a correct run: the
      # moment the evidence gaps close the producer emits "pass" and this line
      # would have turned red on the success it exists to wait for. The rule it
      # was reaching for is that the result must FOLLOW from the gap count, and
      # that rule now has one home -- catalogparity.ControllerResultForGaps --
      # which receipt-gate applies two lines down.
      #
      # The two suite results stay, because they are about this run rather than
      # about the campaign: the released side may pass or carry an accepted
      # limitation, the candidate side may only pass.
      # THE TWO SUITE RESULTS ARE NOT ASSERTED HERE, and the line that did has
      # been deleted rather than ported. The followup step below runs Followup(),
      # which requires the released side to be pass or accepted_limitation and the
      # candidate side to be pass -- the same two conditions -- and then a dozen
      # more about accepted failures, unexpected failures, missing tests and the
      # campaign's declared counts.
      #
      # It was strictly weaker than a check thirty-eight lines below it, on the
      # same receipt, in the same step, with only a gate call and a pretty-print
      # between them -- so it did not even buy early failure. Porting it into Go
      # would have produced a second home for a subset of an assertion that
      # already exists, with mutation tests to make the duplicate look verified.
      # The gap count is a CEILING here, and deliberately absolute rather than
      # relational. The followup step below asserts that the plan and the
      # campaign policy agree; that is blind to both of them growing together,
      # and this is the only thing that catches it. Measured:
      #
      #   plan=7 policy=7   relational PASSES, this FAILS
      #   plan=5 policy=5   relational passes, this passes
      #
      # It used to read == 6, which failed the second row: a surface GAINING
      # coverage turned the gate red. A gate that rejects improvement is a
      # defect; a gate that pins an upper bound is a third opinion. Lower the
      # ceiling when coverage improves. Raising it is a release decision.
      # NO SHELL VARIABLE HERE, DELIBERATELY, and now no shell expression at
      # all. Woodpecker substitutes a dollar-brace name in a command with its
      # OWN pipeline variable before the shell runs, and an undefined name
      # becomes the empty string. An earlier form assigned gaps from jq and
      # compared it; /bin/sh received `test "" -le 6` and died "Illegal number:"
      # on pipeline 228, AFTER the campaign had passed on its merits. A command
      # that takes only literal arguments leaves nothing for Woodpecker to eat.
      #
      # THE CEILING AND ITS EDGE CASES LIVE IN internal/catalogparity NOW, where
      # each one is watched failing. The jq form needed an explicit type test
      # because `null <= 6` is TRUE in jq, so it passed when the field was
      # absent -- green exactly when the receipt stopped carrying the number the
      # gate exists to bound. Go has the opposite trap, absent decoding to zero,
      # and the check tells zero-because-clean from zero-because-missing by
      # whether the plan lists any surfaces at all.
      - go run ./cmd/receipt-gate -gate catalog-controller-differential -receipt /tmp/catalog-controller-differential.json
      - jq '.' /tmp/catalog-controller-differential.json
      # ONE INVOCATION, WHERE THE SHELL NEEDED TWO. The script printed a word and
      # said nothing on a rejection -- one jq -e of fourteen conjuncts, exit 1,
      # no output -- so this line ran it once grepping for diagnostic_complete
      # and again for full, and an operator who failed it learned only that one
      # of fourteen was false. The binary prints the word on stdout and names
      # every failed condition on stderr.
      #
      # It takes no -tree-state because it produces no evidence: it classifies a
      # receipt that already exists.
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-controller-differential -followup /tmp/catalog-controller-differential.json
      # EVERY COMMAND HERE RUNS UNDER THE IMAGE'S /bin/sh, NOT BASH. A bashism
      # fails at its first word, and since these are `&&` chains the rest of the
      # line never runs, so the file it was going to write is simply absent.
      #
      # That matters less for what it breaks than for how it reads. The five
      # commands below each began `source .woodpecker/scripts/tree-state.sh &&`
      # until they were migrated; `source` is not a /bin/sh builtin, so pipeline
      # 232 failed on the NEXT line with `jq: Could not open file
      # /tmp/catalog-hardware-disposition.json`. The error names the consumer,
      # and whoever follows it reads the generator and finds nothing wrong --
      # because the generator never ran. Reach for a command, not a shell
      # feature, and the failure names its own subject.
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-hardware-disposition -controller /tmp/catalog-controller-differential.json -output /tmp/catalog-hardware-disposition.json -tree-state "$(go run ./cmd/tree-state -what 'the hardware disposition receipt')"
      - jq -e '.result == "pass" and .kind == "action" and .name == "unifi_port" and .mode == "protocol_sufficient" and .claim_scope == "controller_poe_configuration_persistence" and .physical_electrical_claim == false and .resolved_signal == "hardware_claim"' /tmp/catalog-hardware-disposition.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-pragmatic-evidence -policy provider-codegen/policy/catalog-campaign.json -inventory build/release-ready/catalog-evidence-inventory.json -fleet-summary build/restricted/catalog-fleet-gap-summary.json -references provider-codegen/policy/catalog-pragmatic-references.json -controller-receipt /tmp/catalog-controller-differential.json -output /tmp/catalog-pragmatic-resolution.json -tree-state "$(go run ./cmd/tree-state -what 'the pragmatic resolution receipt')"
      - jq -e '.result == "blocked_evidence" and .resolved_signal_count == 4 and .remaining_signal_count == 2 and (.controller_receipt_sha256 | length) == 64' /tmp/catalog-pragmatic-resolution.json
      - jq '.' /tmp/catalog-pragmatic-resolution.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-admission -policy provider-codegen/policy/catalog-campaign.json -inventory build/release-ready/catalog-evidence-inventory.json -build-schema /tmp/catalog-build-schema.json -unit /tmp/catalog-unit-differential.json -controller /tmp/catalog-controller-differential.json -pragmatic /tmp/catalog-pragmatic-resolution.json -output /tmp/catalog-admission.json -tree-state "$(go run ./cmd/tree-state -what 'the catalog admission receipt')"
      - jq -e '.result == "pass" and .admitted_surface_count == 67 and .release_blocker_count == 2 and .release_blockers == [{"kind":"managed_resource","name":"unifi_power_supervisor","signal":"acceptance"},{"kind":"action","name":"unifi_port","signal":"hardware_claim"}] and ([.surfaces[] | select(.state != "admitted" or .adapter_state != "adapter_parity")] | length) == 0' /tmp/catalog-admission.json
      - jq '.' /tmp/catalog-admission.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-management-contract -admission /tmp/catalog-admission.json -build-schema /tmp/catalog-build-schema.json -policy provider-codegen/policy/catalog-management-contract.json -output /tmp/catalog-management-contract.json -tree-state "$(go run ./cmd/tree-state -what 'the catalog management contract')"
      - jq -e '.result == "ready_for_downstream_verification" and (.surfaces | length) == 67 and ([.surfaces[] | select(.capture_mode == "managed")] | length) == 28 and ([.surfaces[] | select(.capture_mode == "not_applicable")] | length) == 39' /tmp/catalog-management-contract.json
      - jq '.' /tmp/catalog-management-contract.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/m3-dns-qualification -run-id "$CI_PIPELINE_NUMBER" -candidate-provider /tmp/catalog-build-evidence/terraform-provider-unifi -output /tmp/catalog-dns-lifecycle.json -tree-state "$(go run ./cmd/tree-state -what 'the DNS lifecycle receipt')"
      - jq -e '.result == "pass" and .lifecycle.bidirectional_adapter_state_round_trip == true and .lifecycle.v0_integer_ttl_state_upgrade == true and .cli_outcomes_equivalent == true and .adapter_outcomes_equivalent == true' /tmp/catalog-dns-lifecycle.json
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-migration-recovery -policy provider-codegen/policy/catalog-campaign.json -admission /tmp/catalog-admission.json -build-schema /tmp/catalog-build-schema.json -controller /tmp/catalog-controller-differential.json -inventory build/release-ready/catalog-evidence-inventory.json -migration-manifest provider-codegen/generated/catalog-migration-manifest.json -dns-lifecycle /tmp/catalog-dns-lifecycle.json -output /tmp/catalog-migration-recovery.json -tree-state "$(go run ./cmd/tree-state -what 'the migration and recovery receipt')"
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/catalog-migration-verify -receipt /tmp/catalog-migration-recovery.json
      - jq '.' /tmp/catalog-migration-recovery.json
