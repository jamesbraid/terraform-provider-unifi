when:
  - event: manual

labels:
  pool: skunkworks

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  # The candidate depends on the unreleased go-unifi module, so its build needs
  # the bootstrapped file proxy. The lifecycle step runs in a docker-cli image
  # sharing the host daemon, where a bind mount of a step-local proxy cannot
  # work. Build the candidate here instead and hand the lifecycle step a
  # prebuilt binary, exactly like the differential workflow and the carrier do.
  - name: build-candidate
    # yamllint disable-line rule:line-length
    image: >-
      golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    commands:
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy_test.sh
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy.sh
      - env GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download all
      - mkdir -p m3-candidate
      - env CGO_ENABLED=0 GOFLAGS=-mod=readonly GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go build -trimpath -buildvcs=false -ldflags=-buildid= -o m3-candidate/terraform-provider-unifi .

  - name: locked-network-lifecycle
    image: docker:27.5.1-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache bash coreutils curl git jq tar unzip
      - bash .woodpecker/scripts/m3-evidence-lib_test.sh
      - M3_CANDIDATE_PROVIDER_BINARY=$(pwd)/m3-candidate/terraform-provider-unifi M3_LIFECYCLE_RECEIPT_OUTPUT=build/m3/network-dns-qualification-ci.json bash .woodpecker/scripts/m3-dns-qualification.sh
      - jq -e '.result == "pass" and .lifecycle.bidirectional_adapter_state_round_trip == true' build/m3/network-dns-qualification-ci.json

  - name: promotion-receipt
    image: golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    commands:
      - apt-get update
      - apt-get install --yes --no-install-recommends ca-certificates curl jq unzip
      - curl --fail --location --silent --show-error --output /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
      - echo 'd25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d  /tmp/terraform.zip' | sha256sum --check -
      - curl --fail --location --silent --show-error --output /tmp/tofu.zip https://github.com/opentofu/opentofu/releases/download/v1.12.1/tofu_1.12.1_linux_amd64.zip
      - echo '1fc9af962e3632b7cd0ba27076cd9f1ced177567defe9e331ac37f5a40468575  /tmp/tofu.zip' | sha256sum --check -
      - curl --fail --location --silent --show-error --output /tmp/provider.zip https://github.com/jamesbraid/terraform-provider-unifi/releases/download/v0.101.2/terraform-provider-unifi_0.101.2_linux_amd64.zip
      - echo '9954f29512f0049f0e86908e2fc11a8a0e3cb11f980f3468d5e3da4005fab4b8  /tmp/provider.zip' | sha256sum --check -
      - unzip -q /tmp/terraform.zip -d /usr/local/bin
      - unzip -q /tmp/tofu.zip -d /usr/local/bin
      - mkdir -p /tmp/released-provider
      - unzip -q /tmp/provider.zip -d /tmp/released-provider
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy_test.sh
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy.sh
      - env GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download all
      - bash .woodpecker/scripts/m1-evidence-lib_test.sh
      - GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local M1_RELEASED_PROVIDER_BINARY=/tmp/released-provider/terraform-provider-unifi_v0.101.2 M1_EVIDENCE_OUTPUT_DIRECTORY=/tmp/provider-m1-evidence M1_EVIDENCE_ARCHIVE=/tmp/provider-m1-evidence.tar.gz M1_PRINT_EVIDENCE_BUNDLE=true M3_EXECUTION=woodpecker M3_LIFECYCLE_RECEIPT=build/m3/network-dns-qualification-ci.json M3_MANAGEMENT_SIDECAR_OUTPUT=build/m5/provider-contract-ci.json M3_RECEIPT_OUTPUT=build/m3/dns-operation-ci.json TERRAFORM_BIN=/usr/local/bin/terraform TOFU_BIN=/usr/local/bin/tofu .woodpecker/scripts/m3-dns-operation.sh
      - jq -e '.promotion == "qualified" and .lifecycle.locked_target_result == "pass"' build/m3/dns-operation-ci.json
      - test "$(jq -r .management_sidecar_sha256 build/m3/dns-operation-ci.json)" = "$(sha256sum build/m5/provider-contract-ci.json | awk '{print $1}')"
