when:
  - event: manual

labels:
  pool: skunkworks

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  # The candidate depends on the unreleased go-unifi module, so its build needs
  # the bootstrapped file proxy. The lifecycle step runs in a docker-cli image
  # sharing the host daemon, where a bind mount of a step-local proxy cannot
  # work. Build the candidate here instead and hand the lifecycle step a
  # prebuilt binary, exactly like the differential workflow and the carrier do.
  - name: build-candidate
    # yamllint disable-line rule:line-length
    image: >-
      golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    commands:
      # First command in the first step, so a run that read the wrong workspace
      # says so before any verdict it produces. See cmd/workspace-provenance.
      - go run ./cmd/workspace-provenance
      - apt-get update
      - apt-get install --yes --no-install-recommends jq
      - go run ./cmd/go-unifi-proxy
      # Deliberately not "all" -- see catalog-controller-differential.yml. It
      # writes graph-wide sums into go.sum and the promotion receipt below
      # then refuses the dirty tree.
      - env GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download
      - mkdir -p m3-candidate
      - env CGO_ENABLED=0 GOFLAGS=-mod=readonly GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go build -trimpath -buildvcs=false -ldflags=-buildid= -o m3-candidate/terraform-provider-unifi .

  - name: locked-network-lifecycle
    # This step drives real controllers, and on 2026-08-15 it wedged: no output
    # for fifty minutes, stalled immediately after a destroy, and it outlived an
    # explicit cancel. Only a pipeline-level timeout ended it, an hour in, and
    # it took promotion-receipt down with it -- so the last of three failures we
    # were chasing went unreported for a day because of a step with no bound.
    #
    # WANTED: 25m. Seven minutes is the observed cost; that is generous and
    # still finite. NOT SET, AND NOT SETTABLE HERE -- a step `timeout:` is
    # parsed and discarded, so this step still has no bound of its own. The
    # hour-in kill recorded above was the per-repository server limit, which is
    # the only one that has ever fired. See check_inert_workflow_keys_test.go.
    # golang rather than docker:cli, because the gate is a Go command now and
    # that image carries no toolchain. catalog-controller-differential.yml
    # already runs the same combination -- golang plus the docker socket plus
    # the CLI from apt -- for the same reason.
    image: golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apt-get update
      - apt-get install --yes --no-install-recommends ca-certificates curl docker.io git jq tar unzip
      - env GOPROXY=off GOSUMDB=off 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go run ./cmd/m3-dns-qualification -run-id "$CI_PIPELINE_NUMBER" -candidate-provider "$(pwd)/m3-candidate/terraform-provider-unifi" -output build/m3/network-dns-qualification-ci.json -tree-state "$(go run ./cmd/tree-state -what 'the DNS lifecycle receipt')"
        # BACKSTOP, NOT THE CHECK -- and the REASON it is a backstop changed
        # when the gate stopped being a script. It used to be that both fields
        # were literals the shell wrote only after everything above them had
        # survived set -e, so they meant "the script reached its last line".
        # cmd/m3-dns-qualification sets each from the step whose work
        # succeeded and refuses to emit a receipt with any still false, naming
        # them -- so these are now a second opinion on a derived value rather
        # than a guard against an abort. Retained, not counted as verification.
      - jq -e '.result == "pass" and .lifecycle.bidirectional_adapter_state_round_trip == true' build/m3/network-dns-qualification-ci.json
