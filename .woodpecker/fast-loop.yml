---
when:
  - event: manual
  # A push runs this workflow ALONE, because the other four are manual-only.
  # That is the only way to exercise the fast loop without four other workflows
  # competing for the runner, which matters while the step's own failure
  # reporting is under suspicion.
  #
  # main is listed because leaving it off stopped being a convenience question.
  # This step runs the only check that can see a served schema disagreeing with
  # its runtime model, which is the class that produced 54 controller
  # regressions; with main absent from this list, that check would sit un-run on
  # the branch it protects.
  #
  # EVERY BRANCH, because the previous three-name list meant a work branch got a
  # pipeline record and no execution. That is the worst of the three outcomes:
  # `pipeline ls` shows a row whose status is "created", which reads at a glance
  # like a run, so a branch with no CI at all looked like a branch with CI. Every
  # green claimed for a work branch was one laptop.
  #
  # Widening is cheap precisely because of the note above: the other four
  # workflows are manual-only, so a push can only ever start this one, and it is
  # about a minute with no controller and no docker.
  #
  # Matching is doublestar, so ** spans slashes and a bare * would not have
  # matched any of the prefixed branches everyone actually uses.
  - event: push
    branch:
      include: ["**"]
      # Frozen pre-rewrite lines, kept for provenance and never developed on.
      exclude: ["archive/**"]
  # Measured rather than assumed, because the obvious guess was wrong. Opening
  # a pull request against this repository produced NO PIPELINE AT ALL. ALLOW
  # PULL is enabled so the event reaches the server, but with no workflow
  # declaring pull_request there was nothing to run, and the server created
  # nothing rather than creating an empty success. A probe pull request was
  # opened and closed to establish that: the pipeline counter did not move, and
  # the repository's entire history holds zero pull_request pipelines against
  # three merged pull requests.
  #
  # So the gap was never a green that tested nothing. It is NO CHECK AT ALL on
  # the only path that reaches main, which is quieter than a red and quieter
  # than a false green: a reviewer sees an absence, and an absence is easy to
  # read as nothing to see.
  - event: pull_request

labels:
  pool: skunkworks

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  - name: fast-deterministic-loop
    image: golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    # WANTED: 8m, raised from 5m for the inventory check, which fetches the
    # released tag, two SDK archives, and compiles cmd/catalog-evidence. A
    # timeout would be a red that says nothing about the inventory, which is the
    # failure this step exists to report clearly.
    #
    # NOT SET, AND NEVER WAS. The reasoning above was sound and the mechanism it
    # configured does not exist: a step `timeout:` is parsed and discarded.
    # Pipeline 220 ran seventeen minutes here and was never killed; it ended
    # because someone superseded it. See check_inert_workflow_keys_test.go.
    # The skunkworks guest's Docker volume lives on its persistent cache disk.
    # Keep Go's build/module cache and the locked go-unifi checkout between
    # jobs; the workflow still verifies the checkout and source commit on each
    # run. This requires the repository's trusted-volumes setting.
    volumes:
      - unifi-provider-fast-loop-cache:/ci-cache
    commands:
      # Say which tree this run is about, first, before anything can fail.
      #
      # Woodpecker knows the commit; this step's own output did not carry it, so
      # a green fast-loop was not evidence about any particular tree once the log
      # scrolled. Measured before adding this: not one command in the step
      # emitted a commit, verified against `git rev-parse HEAD` as a positive
      # control so the zero meant something. This line is now the only one that
      # does.
      #
      # That sentence used to say "zero of the sixteen commands", which was true
      # when it was written and stopped being checkable the moment this command
      # made it seventeen. A reader counting the file would find one more than
      # the comment claims and have no way to tell which of them is wrong. A
      # count of a thing the same file controls should not be written down at
      # all -- say the property, and let anyone who wants the number count it.
      #
      # The tree-state work does not reach here and structurally cannot. fast-loop
      # runs checks, not producers; the one guarded generator it reaches --
      # catalog-evidence-inventory.sh, via its self-test, into a temp dir -- is on
      # records_exempt precisely because its artifact is committed and
      # byte-compared and so must NOT carry a tree state.
      #
      # This is a log line, not a receipt. It does not survive log rotation and
      # nothing consumes it. It is here because the alternative was nothing at
      # all, and because the first question asked of a green run is which tree it
      # was.
      #
      # No colon in the format string. YAML reads `printf 'fast-loop: ...` as a
      # mapping rather than a command, which parses without error and hands
      # Woodpecker something that is not a string -- caught by parsing this file
      # rather than by reading it.
      - printf 'fast-loop commit=%s tree=%s\n' "$(git rev-parse HEAD)" "$(test -z "$(git status --porcelain)" && echo clean || echo dirty)"
      - apt-get update
      - apt-get install --yes --no-install-recommends jq
      - export GOCACHE=/ci-cache/go-build GOMODCACHE=/ci-cache/go-mod GO_UNIFI_SOURCE_ROOT=/ci-cache/go-unifi-source
      # Nothing invoked this until now. It reports which evidence generators
      # carry the dirty-tree guard, over a population derived from the tree
      # rather than listed in the check, and it fails when a generator appears
      # in neither the guarded set nor the exemption list. A generator arrives
      # in a push, and this is the only workflow that runs on every push, so
      # this is where it has to be to catch one.
      #
      # It reads files and nothing else -- no network, no build, no controller
      # -- so it goes ahead of everything expensive: a coverage regression
      # should not wait on the Go suite to be reported.
      - bash .woodpecker/scripts/tree-state-coverage_test.sh
      # The coverage check above reports a script as guarded on a static match
      # for evidence_tree_state. This one runs them: it dirties the tree on
      # purpose and requires each to refuse and name the dirt. Without it,
      # "guarded" is a claim about a string rather than about behaviour, which
      # is the shape the coverage check itself exists to find.
      - bash .woodpecker/scripts/tree-state-guard-fires_test.sh
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy_test.sh
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy.sh
      - export GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org GOVCS='*:off' GOTOOLCHAIN=local
      - go test ./...
      - go vet ./...
      # The evidence inventory describes the tree it was generated from, and
      # nothing has ever checked that it still does. The check already existed
      # and already failed -- it was wired to no workflow, so a stale inventory
      # was indistinguishable from a fresh one, and the Go test that compares
      # the campaign policy against it passes because both drifted together.
      #
      # It needs the released tag and both SDK archives. Fetch them here rather
      # than relying on whatever the cache happens to hold, so a missing
      # prerequisite can never be mistaken for staleness.
      - env GIT_TERMINAL_PROMPT=0 git fetch --force --no-tags https://github.com/jamesbraid/terraform-provider-unifi.git refs/tags/v0.101.2:refs/tags/v0.101.2
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.101.0
      - env GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org 'GOVCS=*:off' GIT_TERMINAL_PROMPT=0 GOTOOLCHAIN=local go mod download github.com/jamesbraid/go-unifi@v1.102.0
      - bash .woodpecker/scripts/catalog-evidence-inventory_test.sh
      - go generate ./...
      - git diff --exit-code
