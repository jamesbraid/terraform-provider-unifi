---
when:
  - event: manual
  - event: push
    branch: emdash/control-plane-completion

labels:
  pool: skunkworks

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  - name: fast-deterministic-loop
    image: golang:1.25.8-bookworm@sha256:4557cf171e3cdf5053a298d5171b1a5f5734d920260c25f22c79e94760eb2084
    timeout: 5m
    commands:
      - apt-get update
      - apt-get install --yes --no-install-recommends jq
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy_test.sh
      - bash .woodpecker/scripts/bootstrap-go-unifi-proxy.sh
      - export GOPROXY=file:///tmp/go-unifi-proxy,https://proxy.golang.org GOSUMDB=sum.golang.org GOVCS='*:off' GOTOOLCHAIN=local
      - go test ./...
      - go vet ./...
      - go generate ./...
      - git diff --exit-code
